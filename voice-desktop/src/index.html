<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; media-src 'self' blob:; connect-src 'self' http://127.0.0.1:*;">
  <title>语音输入浮窗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="widget" class="widget">
    <div id="titlebar" class="titlebar">
      <span id="dot" class="dot"></span>
      <span class="title">语音输入</span>
      <div class="actions">
        <button id="btn-copy" class="icon-btn" title="复制全部文本">📋</button>
        <button id="btn-clear" class="icon-btn" title="清空">🗑️</button>
        <button id="btn-min" class="icon-btn" title="最小化">—</button>
        <button id="btn-close" class="icon-btn" title="关闭">✕</button>
      </div>
    </div>

    <div class="status-row">
      <button id="btn-mic" class="mic-btn" title="点击开始/停止语音识别">
        <svg id="mic-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
        </svg>
      </button>
      <span id="status" class="status">正在加载模型…</span>
      <label class="switch" title="识别结束后自动复制">
        <input type="checkbox" id="chk-autocopy">
        <span class="slider"></span>
        <span class="switch-label">自动复制</span>
      </label>
    </div>

    <div class="row">
      <label class="top-toggle" title="是否始终置顶">
        <input type="checkbox" id="chk-top" checked>
        <span class="slider"></span>
        <span class="switch-label">置顶</span>
      </label>
      <select id="engine" class="lang-select" title="识别引擎">
        <option value="aliyun">阿里云（在线）</option>
        <option value="vosk">本地 vosk（离线）</option>
      </select>
      <select id="lang" class="lang-select" title="识别语言">
        <option value="zh-CN">普通话</option>
        <option value="zh-TW">中文(繁體)</option>
        <option value="en-US">English</option>
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
      </select>
    </div>

    <div id="output" class="output" contenteditable="true" spellcheck="false" placeholder="识别结果将显示在这里…"></div>
    <div id="hint" class="hint"></div>
  </div>

  <script src="vosk.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
